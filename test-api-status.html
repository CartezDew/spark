<!DOCTYPE html>
<html>
<head>
    <title>Test Spark API</title>
    <style>
        body {
            font-family: monospace;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #1a1a2e;
            color: #00ff00;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 5px;
        }
        .output {
            background: #000;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            white-space: pre-wrap;
            max-height: 600px;
            overflow-y: auto;
        }
        .error { color: #ff6b6b; }
        .success { color: #51cf66; }
    </style>
</head>
<body>
    <h1>🔍 Spark API Diagnostics</h1>
    
    <button onclick="testNetlifyAPI()">Test Netlify API</button>
    <button onclick="testHealth()">Test Health Endpoint</button>
    <button onclick="clearOutput()">Clear Output</button>
    
    <div class="output" id="output">Click a button to test...</div>
    
    <script>
        const output = document.getElementById('output');
        
        function log(msg, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : '';
            output.innerHTML += `<span class="${className}">[${timestamp}] ${msg}</span>\n`;
            output.scrollTop = output.scrollHeight;
        }
        
        function clearOutput() {
            output.innerHTML = '';
        }
        
        async function testHealth() {
            log('Testing health endpoint...');
            try {
                const response = await fetch('https://cool-biscochitos-b96e4c.netlify.app/api/health');
                const data = await response.json();
                log(JSON.stringify(data, null, 2), 'success');
            } catch (error) {
                log(`Error: ${error.message}`, 'error');
            }
        }
        
        async function testNetlifyAPI() {
            log('Testing Netlify YouTube API...');
            log('URL: https://cool-biscochitos-b96e4c.netlify.app/api/youtube/top?category=Music&maxResults=5');
            
            try {
                const response = await fetch('https://cool-biscochitos-b96e4c.netlify.app/api/youtube/top?category=Music&regionCode=US&maxResults=5');
                log(`Status: ${response.status} ${response.statusText}`);
                
                const data = await response.json();
                log(JSON.stringify(data, null, 2), data.success ? 'success' : 'error');
                
                if (data.success && data.data && data.data.length > 0) {
                    log(`\n✅ SUCCESS! Got ${data.data.length} real videos!`, 'success');
                    log(`First video: "${data.data[0].title}"`, 'success');
                } else if (data.error) {
                    log(`\n❌ ERROR: ${data.error}`, 'error');
                    if (data.message) {
                        log(`Message: ${data.message}`, 'error');
                    }
                }
            } catch (error) {
                log(`\n❌ Fetch Error: ${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>
